# Optional Langfuse tracing stack — enabled by adding this file to the compose
# file list, not by a profile. Opt in per checkout via .env:
#   COMPOSE_FILE=compose.yaml:compose.langfuse.yaml
# (append `:compose.local.yaml` if you use local overrides), or per command:
#   docker compose -f compose.yaml -f compose.langfuse.yaml up -d
# With the file enabled, plain `docker compose up -d` starts the six Langfuse
# services AND wires app-web/app-worker to them (the environment overrides
# below beat the empty LANGFUSE_* defaults from .env). Without it, the app
# runs byte-identically with tracing off — nothing here is required.
#
# Bonus/dev-only: six services implementing Langfuse's current self-hosted
# "v3" architecture (Postgres + ClickHouse + S3-compatible blob store +
# Redis-protocol queue, fronted by a web app and an async worker), following
# the reference compose at
# https://github.com/langfuse/langfuse/blob/main/docker-compose.yml, image
# generation "4" to match the `langfuse` Python SDK pinned in 5.9
# (`langfuse~=4.0`, resolved 4.15.1). Images are pulled from Docker Hub
# (`langfuse/langfuse`, `langfuse/langfuse-worker`) rather than the
# project's own `docker.langfuse.com` registry, which does not resolve from
# this environment's network — same published image, reachable mirror.
#
# A dedicated `langfuse-postgres` is used instead of the shared pgvector
# `postgres` service: simpler and safer than an initdb script on a running
# instance whose existing volume would never re-run init anyway.
#
# No secrets live in this file: every password/key/salt is interpolated from
# git-ignored .env variables (`${LANGFUSE_...:?}` — enabling the file without
# them set fails loudly at compose time). .env.dist documents each variable
# and how to generate a value. Nothing here is published to a host port
# except langfuse-web's UI (3000, chosen to avoid the app's
# 5173/8000/5432/6379); every other service is reachable only inside the
# Compose network.
services:
  # Wire the app to the bundled Langfuse. `environment` beats `env_file`
  # (.env), so the LANGFUSE_PUBLIC_KEY/SECRET_KEY/HOST lines in .env stay
  # empty; disabling this file returns the app to its no-tracing default.
  # The key pair is the same LANGFUSE_INIT_* seed given to langfuse-web
  # below, read from .env.
  app-web:
    environment: &app-langfuse-env
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set in .env, see .env.dist}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set in .env, see .env.dist}
      # Service-name URL: app-web/app-worker reach Langfuse over the Compose
      # network. http://localhost:3000 is only valid from the host browser.
      LANGFUSE_HOST: http://langfuse-web:3000

  app-worker:
    environment: *app-langfuse-env

  langfuse-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?set in .env, see .env.dist}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set in .env, see .env.dist}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  valkey:
    # Redis-protocol queue for Langfuse's ingestion pipeline; named `valkey`
    # (not `redis`) to stay unambiguous next to the app's own `redis` service
    # — they are unrelated brokers on unrelated networks-of-concern.
    image: valkey/valkey:7-alpine
    command: >
      --requirepass ${LANGFUSE_VALKEY_PASSWORD:?set in .env, see .env.dist}
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    # Pre-creates the "langfuse" bucket before starting the server.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:?set in .env, see .env.dist}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  langfuse-worker:
    image: langfuse/langfuse-worker:4
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:?set in .env, see .env.dist}@langfuse-postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:?set in .env, see .env.dist}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set in .env, see .env.dist}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set in .env, see .env.dist}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?set in .env, see .env.dist}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?set in .env, see .env.dist}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_VALKEY_PASSWORD:?set in .env, see .env.dist}

  langfuse-web:
    image: langfuse/langfuse:4
    depends_on: *langfuse-depends-on
    # UI port. Chosen to avoid the app stack's 5173 (frontend)/8000
    # (app-web)/5432 (postgres)/6379 (redis).
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env, see .env.dist}
      # Headless first-boot provisioning: creates the org, project, API key
      # pair (the values wired into app-web/app-worker above) and a login
      # user if they don't exist yet; a no-op on every later boot.
      LANGFUSE_INIT_ORG_ID: local
      LANGFUSE_INIT_ORG_NAME: Local
      LANGFUSE_INIT_PROJECT_ID: moto-advisor
      LANGFUSE_INIT_PROJECT_NAME: Moto Advisor
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set in .env, see .env.dist}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set in .env, see .env.dist}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?set in .env, see .env.dist}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:?set in .env, see .env.dist}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set in .env, see .env.dist}

volumes:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
