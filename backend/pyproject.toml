[project]
name = "app"
version = "0.1.0"
description = "AI Dungeon Master API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.19.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "psycopg[binary,pool]>=3.3.5",
    "typer>=0.27.2",
    "argon2-cffi>=25.1.0",
    "structlog>=26.1.0",
    "python-ulid>=3.1.0",
    "langchain-openrouter>=0.2.8",
    "langchain-core>=1.6.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
]

[project.scripts]
app = "app.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.6",
    # Starlette 1.6.0's TestClient prefers `httpx2` and, absent it, emits a
    # StarletteDeprecationWarning on import -- fatal under
    # filterwarnings=["error"]. See shared-knowledge.md.
    "httpx2>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Anyio >=4.15 deprecates the `anyio.abc.BlockingPortal` alias that
# Starlette 1.6.0's own testclient module still references at import time,
# which is otherwise fatal under filterwarnings=["error"]. Transitive-only
# constraint; anyio is not a direct dependency. See shared-knowledge.md.
constraint-dependencies = ["anyio<4.15"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "-q"
markers = ["database: needs a reachable Postgres"]
