# Alembic configuration. Run from the `backend/` directory (`alembic upgrade head`).
#
# The database URL is NOT configured here: `alembic/env.py` takes it from the
# application settings (DATABASE_URL), so migrations always target the same
# database as the app.

[alembic]
script_location = %(here)s/alembic

# Timestamp-prefixed filenames keep `ls versions/` in chronological order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Make the `app` package importable when alembic runs from `backend/`.
prepend_sys_path = .

path_separator = os

[post_write_hooks]
# Keep generated revisions lint- and format-clean (`ruff check .`/`ruff format`).
hooks = ruff_check,ruff_format
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging configuration, consumed by alembic/env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
