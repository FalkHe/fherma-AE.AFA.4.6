# pnpm treats this file as the (single-package) workspace root and reads
# install settings from it.

# @swc/core (via @vitejs/plugin-react-swc) ships prebuilt native binaries and
# needs its postinstall script; pnpm blocks build scripts unless allowed here.
allowBuilds:
  '@swc/core': true

# pnpm 11 refuses freshly published versions by default (minimumReleaseAge).
# These pins were current when the frontend was scaffolded.
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.5'
  - '@tanstack/react-query@5.102.5'
  - material-symbols@0.47.0
